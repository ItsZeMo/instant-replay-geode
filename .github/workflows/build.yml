name: Build Geode Mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: given
          cli: v3.9.0
          target: Win64
      - uses: actions/upload-artifact@v4
        with:
          name: instant-replay-win64
          path: ${{ steps.build.outputs.build-output }}

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: given
          cli: v3.9.0
          target: MacOS
      - uses: actions/upload-artifact@v4
        with:
          name: instant-replay-macos
          path: ${{ steps.build.outputs.build-output }}

  host-tests-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run macOS host integration tests
        run: |
          mkdir -p build
          clang++ -std=c++23 -Wall -Wextra -fobjc-arc -fobjc-arc-exceptions -DGEODE_IS_MACOS -DGL_SILENCE_DEPRECATION \
            -Isrc -Itests/host/mock_geode \
            tests/host/test_host_mac.mm src/encoder/VideoToolboxEncoder.mm src/platform/MacVideoCapabilities.mm \
            -framework Foundation -framework AVFoundation -framework VideoToolbox \
            -framework CoreMedia -framework CoreVideo -framework CoreAudio \
            -framework AudioToolbox -framework CoreFoundation -framework OpenGL \
            -o build/test_host_mac
          ./build/test_host_mac

  host-tests-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile and run Windows host tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $clang = Join-Path $env:ProgramFiles 'LLVM\bin\clang-cl.exe'
          $compiler = if (Test-Path $clang) { $clang } else { 'cl' }
          & $compiler /nologo /std:c++latest /EHsc /O2 /W3 /I src tests/host/test_host.cpp src/encoder/MfSegmentConcat.cpp /Febuild\test_host.exe /Fobuild\ mfplat.lib mfreadwrite.lib mfuuid.lib ole32.lib /link /DELAYLOAD:mfplat.dll /DELAYLOAD:mfreadwrite.dll delayimp.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/test_host.exe
          exit $LASTEXITCODE
